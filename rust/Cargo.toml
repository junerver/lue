[package]
name = "lue_rs"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings over lue_core for the lue terminal eBook reader"

[lib]
name = "lue_rs"
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["core", "app"]

[dependencies]
lue_core = { path = "core" }
pyo3 = { version = "0.23", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1
