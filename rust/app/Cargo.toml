[package]
name = "lue"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust terminal eBook reader (lue-rs native binary)"

[[bin]]
name = "lue"
path = "src/main.rs"

[dependencies]
lue_core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
