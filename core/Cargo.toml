[package]
name = "lue_core"
version = "1.0.0"
edition = "2021"
description = "Pure-Rust document core for the lue reader: text pipeline, TXT indexing and layout engine"

[dependencies]
fancy-regex = "0.14"
regex = "1.13.1"
encoding_rs = "0.8.35"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
sha2 = "0.10"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
pdf-extract = "0.7"
